# Watchman 画中画 YAML 2.3
# 来源：接口仓 interface_sdk-js/zh-cn/api/@ohos.PiPWindow.d.ts
#       文档仓 docs/zh-cn/application-dev/reference/apis-arkui/js-apis-pipWindow.md
#       实现仓 window_window_manager（NAPI js_pip_* + PictureInPictureController）
# 前端仓 repos.fe 未配置，不猜应用侧锚点。
# 原子 = 一次对外调用。create 只创建控制器；真正建窗在 start。
schema_version: "2.3.0"
module_id: pip
enabled: true
meta:
  name: 画中画
  name_en: Picture-in-Picture
  subsystem: Window
  field_id: RF-WMS-PIP
  field_name: WMS-PiP
  description: |
    【做什么】应用通过 @ohos.PiPWindow（isPiPEnabled / create）和 PiPController
    （startPiP / stopPiP / setAutoStartEnabled / updateContentNode）在主窗口上创建控制器、启动、停止画中画小窗。
    NDK 对应 OH_PictureInPicture_CreatePip / StartPip / StopPip。
    【典型现象】create 报 401 参数错误、801 能力不支持、第二次 startPiP 失败、stop 后还原 Navigation 失败、主窗未 show 时启动失败。
    【不要分流】普通子窗/系统悬浮窗（createSubWindow、floatWindow）→ 子窗/悬浮窗；
    分屏/自由多窗 → 分屏；纯播放器 overlay、从未 startPiP → 媒体；
    startPiP 已成功但画面黑（XComponent/surface）→ 依赖 ArkUI。
    【怎么定位】阶段二按原子时间线回放：创建✓ → 启动✓/✗ → 停止✓/✗。
  owners: []
  kb:
    path: window_window_manager/docs/kb/pip-kb.md
    feature_dir: localize-kb/features/pip
log_whitelist:
  - id: WL-WMS-PIP
    regex: '(?:WmsLogTag::)?WMS_PIP\b'
    flags: i
    meaning: 本模块主 tag，命中即可确认归画中画
  - id: WL-PARAM
    regex: pipOption\s+param\s+error
    flags: i
    meaning: create 时 NAPI 参数校验失败
  - id: WL-LIFE
    regex: (?:OnStartPictureInPicture\s+is\s+called|OnStopPictureInPicture\s+is\s+called|CreateJsPipController|\bSTART_PIP\b|\bSTOP_PIP\b)
    flags: i
    meaning: 启停入口或 HiSysEvent 埋点
log_blacklist:
  - id: BL-FLOAT
    regex: (?:createSubWindow|floatWindow|\bsubWindow\b)
    flags: i
    to_module: subwindow
    to_module_name: 子窗/悬浮窗
    reason: 无本模块白名单时，更像普通子窗或系统悬浮窗
    unless_whitelist: true
  - id: BL-SPLIT
    regex: (?:FreeWindow|FreeMultiWindow|splitScreen|ISplit)
    flags: i
    to_module: split
    to_module_name: 分屏/自由多窗
    reason: 分屏/自由多窗日志，不是画中画
    unless_whitelist: true
  - id: BL-AV
    regex: (?:\bAVPlayer\b|OH_AVPlayer)
    flags: i
    to_module: media
    to_module_name: 媒体播放
    reason: 纯播放器路径，除非同时命中画中画白名单
    unless_whitelist: true
apis:
  external:
    - { id: PiPWindow.isPiPEnabled, role: 能力探测 }
    - { id: PiPWindow.create, role: 创建控制器 }
    - { id: PiPController.startPiP, role: 启动 }
    - { id: PiPController.stopPiP, role: 停止 }
    - { id: PiPController.setAutoStartEnabled, role: 自动启动 }
    - { id: PiPController.updateContentNode, role: 更新内容节点 }
    - { id: PiPWindow.on, label: PiPWindow.on('stateChange'), role: 状态回调 }
    - { id: OH_PictureInPicture_CreatePip, role: NDK 创建 }
    - { id: OH_PictureInPicture_StartPip, role: NDK 启动 }
    - { id: OH_PictureInPicture_StopPip, role: NDK 停止 }
  internal:
    - { id: JsPipWindowManager, role: NAPI 创建与参数校验 }
    - { id: JsPipController, role: NAPI 启停转发 }
    - { id: PictureInPictureController, role: 控制器与建窗校验 }
    - { id: PictureInPictureControllerBase, role: 启停状态机与显隐 }
    - { id: PictureInPictureManager, role: 控制器管理 }
    - { id: PiPReporter, role: HiSysEvent 上报 }
  dependencies:
    - { id: navController, module: navigation, role: 还原原页 }
    - { id: XComponentController, module: arkui, role: 内容节点 }
    - { id: typeNode, module: arkui, role: typeNode 内容节点 }
    - { id: FloatWindowManager, module: subwindow, role: 真正创建/销毁 PiP 窗口 }
collect:
  title: 请复制下面这一条正则到 BetaClub 搜集日志，把命中行完整粘贴到阶段二
  where: BetaClub
  hint: 只需这一条正则。搜集后把结果原样贴到下方。
  regex: >-
    (?:WMS_PIP|pipOption\s+param\s+error|config\s+is\s+null|CreateJsPipController|OnStartPictureInPicture|OnStopPictureInPicture|OnSetAutoStartEnabled|OnUpdateContentNode|pipWindow\s+is\s+starting|Repeat\s+stop\s+request|Repeated\s+PiP|START_PIP|STOP_PIP|RESOTRE_PIP|start\s+pip\s+success|show\s+pip\s+success|pip\s+window\s+stop\s+success|Create\s+pip\s+window\s+failed|Show\s+pip\s+window\s+failed|Create\s+pip\s+failed|mainWindow\s+is\s+not\s+shown|Window\s+create\s+failed|Navigation\s+operate\s+failed|Get\s+navController\s+error|Top\s+is\s+not\s+navDestination|navController\s+is\s+nullptr|setXController|xComponentController\s+is\s+null|main\s+window\s+xComponent\s+not\s+set|Invalid\s+typeNode|updateNode\s+success|restore\s+pip\s+main\s+window\s+finished)
atoms:
  - id: create
    title: 创建
    api: PiPWindow.create
    callchain:
      - { layer_id: L-JS, name: 应用调用 create, do: 组装 PiPConfiguration（context / XComponent / template / controlGroup），可选传入 typeNode, symbols: [PiPWindow.create] }
      - { layer_id: L-NAPI, name: NAPI 校验, do: JsPipWindowManager 解析 config，校验模板与控件组, symbols: [JsPipWindowManager] }
      - { layer_id: L-WM-CLIENT, name: 拿到主窗并构造控制器, do: GetMainWindowWithContext 后 new PictureInPictureController；此时还不建 PiP 窗口, symbols: [PictureInPictureController, PictureInPictureManager] }
    enter:
      - id: IN-CREATE
        meaning: 已进入 PiPWindow.create
        regex: '\[NAPI\]'
        flags: i
        layer_id: L-NAPI
        function: JsPipWindowManager
    success:
      - id: OK-CREATE
        meaning: 控制器已创建，create 完成；窗口要等 startPiP
        regex: CreateJsPipController
        flags: i
        layer_id: L-NAPI
        function: JsPipController
    failures:
      - id: FAIL-CREATE-CONFIG-NULL
        title: 配置为空
        kind: 应用误用
        when: create 未传 config 或为 null
        meaning: 断在 NAPI，未进控制器
        locate: 看 config is null / Missing args
        regex: '(?:config\s+is\s+null|Missing\s+args\s+when\s+creating\s+pipController)'
        flags: i
        layer_id: L-NAPI
        function: JsPipWindowManager
      - id: FAIL-CREATE-PARAM
        title: 参数非法
        kind: 应用误用
        when: context / XComponent / template / controlGroup / defaultWindowSizeType 不合法，文档对应 401
        meaning: 断在 NAPI 参数校验，请求未构造控制器
        locate: 看 pipOption param error 后半句，区分缺 context、缺 XComponent、模板不支持、控件组不匹配
        regex: pipOption\s+param\s+error
        flags: i
        layer_id: L-NAPI
        function: JsPipWindowManager
      - id: FAIL-CREATE-CTX
        title: 缺少 Ability context
        kind: 应用误用
        when: config.context 为空
        meaning: 断在 NAPI
        regex: '(?:pipOption\s+param\s+error,\s*)?context\s+is\s+nullptr\.?'
        flags: i
        layer_id: L-NAPI
        function: JsPipWindowManager
      - id: FAIL-CREATE-XCC
        title: 缺少 XComponentController
        kind: 应用误用
        when: 非 typeNode 路径未传 componentController
        meaning: 断在 NAPI
        regex: '(?:pipOption\s+param\s+error,\s*)?XComponentController\s+is\s+nullptr\.?'
        flags: i
        layer_id: L-NAPI
        function: JsPipWindowManager
      - id: FAIL-CREATE-TPL
        title: 模板非法或不支持
        kind: 应用误用
        when: pipTemplateType 不存在、设备不支持、或仅系统应用可用
        meaning: 断在 NAPI
        regex: 'pipOption\s+param\s+error,\s*(?:unsupported\s+pipTemplateType|pipTemplateType\s+not\s+exists|pipTemplateType\s+not\s+supported|templateType\s+\d+\s+requires\s+system\s+app)'
        flags: i
        layer_id: L-NAPI
        function: JsPipWindowManager
      - id: FAIL-CREATE-CG
        title: 控件组不匹配
        kind: 应用误用
        when: controlGroups 与 templateType 不对应或内部冲突，文档对应 401
        meaning: 断在 NAPI
        regex: 'pipOption\s+param\s+error,\s*(?:controlGroup\s+not\s+matches|\d+\s+conflicts\s+with\s+\d+\s+in\s+controlGroups)'
        flags: i
        layer_id: L-NAPI
        function: JsPipWindowManager
      - id: FAIL-CREATE-SIZE-TYPE
        title: 默认窗口尺寸类型非法
        kind: 应用误用
        when: defaultWindowSizeType 非法
        meaning: 断在 NAPI
        regex: 'pipOption\s+param\s+error,\s*invalid\s+defaultWindowSizeType'
        flags: i
        layer_id: L-NAPI
        function: JsPipWindowManager

  - id: start
    title: 启动
    api: PiPController.startPiP
    callchain:
      - { layer_id: L-JS, name: 应用调用 startPiP, do: 启动画中画；错误码 1300012～1300015、1300034, symbols: [PiPController.startPiP, OH_PictureInPicture_StartPip] }
      - { layer_id: L-NAPI, name: NAPI 转发, do: JsPipController 调 StartPictureInPicture(USER_START), symbols: [JsPipController] }
      - { layer_id: L-WM-CLIENT, name: 状态机与建窗, do: 校验状态后 CreatePipWindow + Show；主窗未 show、重复启动、Navigation 失败都停在这, symbols: [PictureInPictureController, PictureInPictureControllerBase] }
      - { layer_id: L-WM-SESSION, name: 窗口创建, do: FloatWindowManager.CreatePipWindow 真正出窗, symbols: [FloatWindowManager] }
      - { layer_id: L-DEP-NAV, name: Navigation 缓存, do: start 前 IsPullPiPAndHandleNavigation，失败则整次启动失败, symbols: [navController] }
      - { layer_id: L-DEP-XCOMP, name: 内容节点, do: 非 typeNode 路径把 XComponent 挂到 PiP 窗, symbols: [XComponentController] }
    enter:
      - id: IN-START
        meaning: 已进入 startPiP
        regex: OnStartPictureInPicture\s+is\s+called
        flags: i
        layer_id: L-NAPI
        function: JsPipController
    success:
      - id: OK-START
        meaning: 启动完成，窗口已 show
        regex: '(?:start\s+pip\s+success|show\s+pip\s+success)'
        flags: i
        layer_id: L-WM-CLIENT
        function: PictureInPictureControllerBase
      - id: OK-START-EVENT
        meaning: HiSysEvent 上报启动成功
        regex: '\bSTART_PIP\b'
        flags: i
        layer_id: L-WM-CLIENT
        function: PiPReporter
    failures:
      - id: FAIL-START-ABORT
        title: 启动被中止
        kind: 应用误用
        when: ShouldAbortPipStart 为真（例如已有冲突的启动）
        meaning: NAPI 直接 abort，未进控制器
        regex: OnStartPictureInPicture\s+abort
        flags: i
        layer_id: L-NAPI
        function: JsPipController
      - id: FAIL-START-REPEAT
        title: 重复启动
        kind: 应用误用
        when: 已在 STARTING 或 STARTED，文档对应 1300015
        meaning: 状态机拒绝，对照日志 state
        locate: pipWindow is starting 后的 state 值
        regex: 'pipWindow\s+is\s+starting,\s*state:\s*\d+'
        flags: i
        layer_id: L-WM-CLIENT
        function: PictureInPictureController
      - id: FAIL-START-REPEAT-MSG
        title: 重复 PiP 操作
        kind: 应用误用
        when: 返回 Repeated PiP operation
        meaning: 与重复启动同一类
        regex: Repeated\s+PiP\s+operation\.?
        flags: i
        layer_id: L-WM-CLIENT
        function: PictureInPictureController
      - id: FAIL-START-MAIN-NOT-SHOWN
        title: 主窗未显示
        kind: 应用误用
        when: 非自动启动且主窗不是 STATE_SHOWN，文档对应 1300013
        meaning: 建窗校验失败，未创建 PiP 窗口
        regex: mainWindow\s+is\s+not\s+shown\.\s*create\s+failed\.?
        flags: i
        layer_id: L-WM-CLIENT
        function: PictureInPictureController
      - id: FAIL-START-INVALID-OPTION
        title: 启动时 pipOption 非法
        kind: 应用误用
        when: start 时 pipOption 或 context 已空，文档对应 1300013
        meaning: 断在控制器校验
        regex: '(?:Create\s+pip\s+failed,\s*invalid\s+pipOption|pipOption\s+is\s+null\s+or\s+Get\s+PictureInPictureOption\s+failed)'
        flags: i
        layer_id: L-WM-CLIENT
        function: PictureInPictureController
      - id: FAIL-START-NO-MAIN
        title: 主窗或 XComponent 为空
        kind: 应用误用
        when: 非 typeNode 且主窗或 XComponentController 为空，文档对应 1300013
        meaning: 断在建窗校验
        regex: mainWindowXComponentController\s+or\s+mainWindow\s+is\s+nullptr
        flags: i
        layer_id: L-WM-CLIENT
        function: PictureInPictureController
      - id: FAIL-START-NAV
        title: Navigation 操作失败
        kind: 依赖失败
        when: start 前缓存原页失败，文档对应 1300013
        meaning: 断在 Navigation，窗口未拉起
        locate: 对照 Get navController error / Top is not navDestination
        regex: Navigation\s+operate\s+failed
        flags: i
        layer_id: L-DEP-NAV
        function: navController
      - id: FAIL-START-NAV-CTRL
        title: 拿不到 navController
        kind: 依赖失败
        when: 配置了 navigationId 但主窗 UIContent 上找不到
        meaning: 断在 Navigation
        regex: Get\s+navController\s+error
        flags: i
        layer_id: L-DEP-NAV
        function: navController
      - id: FAIL-START-NAV-TOP
        title: 栈顶不是 NavDestination
        kind: 依赖失败
        when: Navigation 栈顶不是可缓存页面
        meaning: 断在 Navigation
        regex: Top\s+is\s+not\s+navDestination
        flags: i
        layer_id: L-DEP-NAV
        function: navController
      - id: FAIL-START-CREATE-WIN
        title: 创建 PiP 窗口失败
        kind: 框架缺陷
        when: FloatWindowManager.CreatePipWindow 失败，文档对应 1300013 / 1300034
        meaning: 控制器已放行，窗口服务没建出窗
        locate: 若同时有 App has already started float view 则是与其它浮窗冲突（1300034）
        regex: '(?:Create\s+pip\s+window\s+failed|Window\s+create\s+failed,\s*reason:)'
        flags: i
        layer_id: L-WM-SESSION
        function: FloatWindowManager
      - id: FAIL-START-SHOW
        title: 显示 PiP 窗口失败
        kind: 框架缺陷
        when: window.Show 失败，文档对应 1300014
        meaning: 窗已创建但没 show 出来
        regex: Show\s+pip\s+window\s+failed
        flags: i
        layer_id: L-WM-CLIENT
        function: PictureInPictureControllerBase
      - id: FAIL-START-XCOMP
        title: XComponent 挂接失败
        kind: 依赖失败
        when: 非 typeNode 路径 setXController 时空指针，画面会黑
        meaning: 启动链路里内容节点没挂上
        regex: error\s+when\s+setXController[\s\S]{0,80}?xComponentController\s+is\s+null
        flags: i
        layer_id: L-DEP-XCOMP
        function: XComponentController

  - id: stop
    title: 停止
    api: PiPController.stopPiP
    callchain:
      - { layer_id: L-JS, name: 应用调用 stopPiP, do: 停止画中画；错误码 1300011 / 1300012 / 1300015, symbols: [PiPController.stopPiP, OH_PictureInPicture_StopPip] }
      - { layer_id: L-NAPI, name: NAPI 转发, do: StopPictureInPictureFromClient, symbols: [JsPipController] }
      - { layer_id: L-WM-CLIENT, name: 状态机与销毁, do: STOPPING 后销毁窗口并还原主窗, symbols: [PictureInPictureControllerBase] }
      - { layer_id: L-DEP-NAV, name: 还原原页, do: RestorePictureInPictureWindow / PushInPIP 回退, symbols: [navController] }
    enter:
      - id: IN-STOP
        meaning: 已进入 stopPiP
        regex: OnStopPictureInPicture\s+is\s+called
        flags: i
        layer_id: L-NAPI
        function: JsPipController
    success:
      - id: OK-STOP
        meaning: 窗口已停止
        regex: pip\s+window\s+stop\s+success
        flags: i
        layer_id: L-WM-CLIENT
        function: PictureInPictureControllerBase
      - id: OK-STOP-EVENT
        meaning: HiSysEvent 上报停止
        regex: '\bSTOP_PIP\b'
        flags: i
        layer_id: L-WM-CLIENT
        function: PiPReporter
      - id: OK-RESTORE
        meaning: 主窗还原完成
        regex: restore\s+pip\s+main\s+window\s+finished
        flags: i
        layer_id: L-DEP-NAV
        function: PictureInPictureController
    failures:
      - id: FAIL-STOP-REPEAT
        title: 重复停止
        kind: 应用误用
        when: 已在 STOPPING / STOPPED / RESTORING，文档对应 1300015
        meaning: 状态机拒绝，对照 curState
        regex: 'Repeat\s+stop\s+request(?:,\s*curState:\s*\d+)?'
        flags: i
        layer_id: L-WM-CLIENT
        function: PictureInPictureControllerBase
      - id: FAIL-STOP-NO-WIN
        title: 窗口不存在
        kind: 应用误用
        when: 尚未 start 或已销毁再 stop，文档对应 1300012
        meaning: 没有可停的 PiP 窗口
        regex: '(?:window\s+is\s+null\s+when\s+stop\s+from\s+client|window\s+is\s+nullptr\s+when\s+stop\s+pip|window\s+is\s+nullptr\s+in\s+stop\s+pip\s+inner)'
        flags: i
        layer_id: L-WM-CLIENT
        function: PictureInPictureControllerBase
      - id: FAIL-STOP-DESTROY
        title: 销毁窗口失败
        kind: 框架缺陷
        when: DestroyFloatWindow 失败，文档对应 1300011
        meaning: 停止过程中窗口销毁失败
        regex: 'window\s+destroy\s+failed,\s*err:'
        flags: i
        layer_id: L-WM-CLIENT
        function: PictureInPictureControllerBase
      - id: FAIL-STOP-NAV
        title: 还原时 navController 为空
        kind: 依赖失败
        when: stop/还原时找不到 Navigation
        meaning: 窗口可能已停，原页没还原
        regex: navController\s+is\s+nullptr
        flags: i
        layer_id: L-DEP-NAV
        function: navController

  - id: autostart
    title: 自动启动
    api: PiPController.setAutoStartEnabled
    callchain:
      - { layer_id: L-JS, name: 应用调用 setAutoStartEnabled, symbols: [PiPController.setAutoStartEnabled] }
      - { layer_id: L-NAPI, name: NAPI 转发, symbols: [JsPipController] }
      - { layer_id: L-WM-CLIENT, name: 登记自动启动, do: 主窗退后台时由框架再走 start 路径, symbols: [PictureInPictureController, PictureInPictureManager] }
    enter:
      - id: IN-AUTOSTART
        meaning: 已进入 setAutoStartEnabled
        regex: OnSetAutoStartEnabled\s+is\s+called
        flags: i
        layer_id: L-NAPI
        function: JsPipController
    success:
      - id: OK-AUTOSTART
        meaning: 已登记或取消自动启动
        regex: 'enable:\s*\d+,\s*mainWindow:\s*\d+'
        flags: i
        layer_id: L-WM-CLIENT
        function: PictureInPictureController
    failures:
      - id: FAIL-AUTOSTART-ARG
        title: 参数不是 bool
        kind: 应用误用
        when: 入参转换失败
        meaning: 断在 NAPI
        regex: Failed\s+to\s+convert\s+parameter\s+to\s+bool
        flags: i
        layer_id: L-NAPI
        function: JsPipController
      - id: FAIL-AUTOSTART-NAV
        title: 自动启动时 Navigation 失败
        kind: 依赖失败
        when: 开启自动启动时缓存 Navigation 失败
        meaning: 自动启动登记不完整
        regex: Navigation\s+operate\s+failed
        flags: i
        layer_id: L-DEP-NAV
        function: navController

  - id: updateNode
    title: 更新内容节点
    api: PiPController.updateContentNode
    callchain:
      - { layer_id: L-JS, name: 应用调用 updateContentNode, do: 仅 typeNode 创建路径使用, symbols: [PiPController.updateContentNode] }
      - { layer_id: L-NAPI, name: NAPI 校验 typeNode, symbols: [JsPipController] }
      - { layer_id: L-WM-CLIENT, name: 更新节点, symbols: [PictureInPictureController] }
    enter:
      - id: IN-NODE
        meaning: 已进入 updateContentNode
        regex: OnUpdateContentNode\s+is\s+called
        flags: i
        layer_id: L-NAPI
        function: JsPipController
    success:
      - id: OK-NODE
        meaning: 内容节点更新成功
        regex: updateNode\s+success
        flags: i
        layer_id: L-WM-CLIENT
        function: PictureInPictureController
    failures:
      - id: FAIL-NODE-INVALID
        title: typeNode 非法
        kind: 应用误用
        when: 未传或类型不对，文档对应 401
        meaning: 断在 NAPI
        regex: Invalid\s+typeNode
        flags: i
