# 每次请求扫描 modules/<id>/module.yaml（跳过 _template）。
# 新模块丢进该目录即可出现在下拉框，不必改本文件。
# 不想加载某个目录时写入 disabled。

schema_version: "2.2.0"

routing:
  min_score: 15
  high_confidence: 50
  ambiguous_margin: 10
  max_alternatives: 3
  unknown_module: unknown
  auto_correct: false
  reassign_ui: buttons
  misroute_penalty: -25
  misroute_boost: 20

disabled: []
